name: Publish to npm

# Publishes when a push to main carries a packages/voice/package.json version that is not yet on npm.
# Bump `version` (PR → main) to release. Idempotent: re-runs are no-ops.
#
# Auth: npm Trusted Publishing (OIDC) — configure once on npmjs.com:
#   package → Settings → Trusted Publisher → GitHub Actions
#   owner: purpledevilai, repository: <this repo>, workflow: publish.yml
# No NPM_TOKEN / secrets needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ajentify/voice typecheck
      - run: pnpm --filter @ajentify/voice build
      - run: pnpm --filter @ajentify/voice test --if-present

      - name: Publish if this version is new
        working-directory: packages/voice
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION already on npm — nothing to publish"
            exit 0
          fi
          FLAGS="--access public"
          if node -e "process.exit(require('./package.json').repository ? 0 : 1)"; then FLAGS="$FLAGS --provenance"; fi
          npm publish $FLAGS
          echo "::notice::published $NAME@$VERSION"
